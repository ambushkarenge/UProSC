<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0F172A" />
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg-glow)" />

  <!-- Track rings -->
  <circle cx="256" cy="256" r="168" stroke="#334155" stroke-width="34" stroke-opacity="0.45" />
  <circle cx="256" cy="256" r="118" stroke="#334155" stroke-width="34" stroke-opacity="0.45" />
  <circle cx="256" cy="256" r="68" stroke="#334155" stroke-width="34" stroke-opacity="0.45" />

  <!-- Ring 1: Focus (Rose) ~78% -->
  <circle
    cx="256"
    cy="256"
    r="168"
    stroke="#F43F5E"
    stroke-width="34"
    stroke-linecap="round"
    stroke-dasharray="823 1056"
    transform="rotate(-90 256 256)"
  />

  <!-- Ring 2: To-Do (Emerald) ~68% -->
  <circle
    cx="256"
    cy="256"
    r="118"
    stroke="#10B981"
    stroke-width="34"
    stroke-linecap="round"
    stroke-dasharray="504 742"
    transform="rotate(-90 256 256)"
  />

  <!-- Ring 3: Habits (Sky) ~82% -->
  <circle
    cx="256"
    cy="256"
    r="68"
    stroke="#0EA5E9"
    stroke-width="34"
    stroke-linecap="round"
    stroke-dasharray="350 428"
    transform="rotate(-90 256 256)"
  />

  <!-- Center focus dot -->
  <circle cx="256" cy="256" r="16" fill="#F8FAFC" />
</svg>
